name: Build and publish Debian base image

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Tags are a publication boundary, so publishing runs must not race each other.
concurrency:
  group: debian-base-publish
  cancel-in-progress: false

env:
  IMAGE_NAME: reduct/debian-base

jobs:
  build-test-scan:
    name: ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            debian_arch: amd64
            suffix: amd64
          - platform: linux/arm64
            debian_arch: arm64
            suffix: arm64
          - platform: linux/arm/v7
            debian_arch: armhf
            suffix: armv7
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build validation image
        if: github.event_name == 'pull_request'
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --load \
            --tag "local/debian-base:${{ matrix.suffix }}" \
            .

      - name: Build and push image by digest
        if: github.event_name != 'pull_request'
        run: |
          docker buildx build \
            --platform "${{ matrix.platform }}" \
            --metadata-file metadata.json \
            --output "type=image,name=${IMAGE_NAME},push=true,push-by-digest=true,name-canonical=true" \
            .
          jq -er '."containerimage.digest"' metadata.json > "${{ matrix.suffix }}.digest"

      - name: Select image to test
        id: image
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "reference=local/debian-base:${{ matrix.suffix }}" >> "$GITHUB_OUTPUT"
          else
            echo "reference=${IMAGE_NAME}@$(<"${{ matrix.suffix }}.digest")" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke test image
        env:
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
          PLATFORM: ${{ matrix.platform }}
          DEBIAN_ARCH: ${{ matrix.debian_arch }}
        run: |
          docker run --rm --platform "$PLATFORM" "$IMAGE_REFERENCE" /bin/sh -eu -c '
            test "$(. /etc/os-release && printf "%s" "$VERSION_CODENAME")" = "trixie"
            test "$(dpkg --print-architecture)" = "'"$DEBIAN_ARCH"'"
            test -z "$(dpkg --audit)"
            command -v update-ca-certificates >/dev/null
            test -f /etc/ssl/certs/ca-certificates.crt
          '

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.reference }}
          format: table
          exit-code: "1"
          trivyignores: .trivyignore.yaml
          ignore-unfixed: "true"
          severity: HIGH,CRITICAL
          vuln-type: os,library
          cache: "false"

      - name: Upload pushed digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digest-${{ matrix.suffix }}
          path: ${{ matrix.suffix }}.digest
          if-no-files-found: error
          retention-days: 1

  publish-manifest:
    name: Publish manifest
    if: github.event_name != 'pull_request'
    needs: build-test-scan
    runs-on: ubuntu-24.04
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Download architecture digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Create multi-platform manifest
        id: tags
        run: |
          date_tag="trixie-$(date --utc +%Y%m%d)-${GITHUB_RUN_ID}"
          echo "date_tag=$date_tag" >> "$GITHUB_OUTPUT"
          mapfile -t digest_files < <(printf '%s\n' digests/*.digest)
          test "${#digest_files[@]}" -eq 3
          references=()
          for digest_file in "${digest_files[@]}"; do
            references+=("${IMAGE_NAME}@$(<"$digest_file")")
          done
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:latest" \
            --tag "${IMAGE_NAME}:trixie" \
            --tag "${IMAGE_NAME}:${date_tag}" \
            "${references[@]}"

      - name: Verify manifest platforms
        run: |
          docker buildx imagetools inspect --raw "${IMAGE_NAME}:trixie" > manifest.json
          jq -e \
            --argjson expected '["linux/amd64", "linux/arm64", "linux/arm/v7"]' \
            '
              [ .manifests[]
                | select(.platform.os != "unknown" and .platform.architecture != "unknown")
                | "\(.platform.os)/\(.platform.architecture)\(if .platform.architecture == "arm" and .platform.variant then "/\(.platform.variant)" else "" end)"
              ] as $platforms
              | ($platforms | length == 3)
              and ($platforms | sort == ($expected | sort))
            ' manifest.json
